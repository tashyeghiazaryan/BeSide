<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BeSide — use the app code</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background: #f7f1f4; color: #2d2d44;
      display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; padding: 24px; }
    .card { max-width: 420px; background: white; border-radius: 20px; padding: 28px; box-shadow: 0 12px 40px rgba(45,45,68,.12); }
    h1 { font-weight: 300; font-size: 28px; margin: 0 0 12px; }
    p { font-weight: 300; line-height: 1.45; color: rgba(0,0,0,.55); margin: 0 0 10px; }
    code { background: #f1eef5; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>beside</h1>
    <p>This email link is for web only. For the iOS app, <strong>do not use this page</strong>.</p>
    <p>Open <strong>BeSide</strong> on your phone/simulator and type the <strong>6-digit code</strong> from the email.</p>
    <p>If you see <code>otp_expired</code>, tap <strong>Resend code</strong> in the app and use the new digits.</p>
  </div>
</body>
</html>
