schema: spec-driven

context: |
  BeSide is a native SwiftUI couple app (iOS 18+) under `beside/beside/`.
  Open via `beside/beside.xcworkspace` (wraps `beside.xcodeproj`).
  Domain state today lives in a single `@Observable` `MeSessionStore` (session-only demo).
  Backend target: Supabase (Auth email OTP, Postgres + RLS, Storage, Realtime).
  Design reference: `design-reference/` (Figma Make / React). Field QA checklist: `Требования полей.md`
  (not OpenSpec truth — specs under `openspec/specs/` win).
  Commit style: short imperative sentences (e.g. "Ship …", "Add …").

rules:
  proposal:
    - Keep Why / What / Capabilities / Impact
    - Call out Non-goals when the change is large
  design:
    - Document Decisions with alternatives considered
    - Include Migration / Rollback notes for data or auth changes
  tasks:
    - Prefer phased checklists (auth → moods → us → connection)
  specs:
    - Spec deltas use full requirement text under ## ADDED / ## MODIFIED Requirements
    - When replacing session-demo partner behavior, say whether DEBUG demo remains
